[workspace]
members = ["crates/*"]
# `fuzz` is excluded for the same reason as `stet-wasm`: it needs a nightly
# toolchain (cargo-fuzz builds on libFuzzer), and stet is stable-only with a
# pinned MSRV. Excluding it keeps `cargo build`, `cargo test`, and the MSRV
# job from ever seeing it.
exclude = ["crates/stet-wasm", "fuzz"]
# MSRV-aware resolution (stabilised in Cargo 1.84, well under our 1.88 floor).
# Under resolver 2 the `rust-version` below is inert for resolution: cargo
# takes the newest semver-compatible dependency and only refuses afterwards.
# With 456 packages in the lock, a routine `cargo update` would eventually
# pull one needing a newer rustc and break the MSRV job. Resolver 3 picks the
# last version compatible with our rust-version instead, so the `msrv` CI job
# becomes the backstop rather than the only line of defence.
#
# This is already load-bearing, not just insurance: as of 2026-08-15 a plain
# `cargo update` wants hayro-jpeg2000 0.4.0 (needs 1.92) and moxcms 0.9.0
# (needs 1.89). Resolver 3 holds both back; resolver 2 would have taken them
# and broken the floor on the spot. Adopting it left the lockfile
# byte-identical — the *locked* versions were already MSRV-clean.
resolver = "3"

[workspace.package]
version = "0.6.0"
edition = "2024"
# Verified by compiling, not inferred: the `msrv` CI job builds the workspace
# on exactly this toolchain. 1.88 is what let-chains need, and first-party
# code uses them in 282 places. Raising this is allowed in any minor release
# — see the MSRV note in README.md — but it must be a deliberate edit with a
# CHANGELOG line, never a silent consequence of a `cargo update`.
rust-version = "1.88"
license = "Apache-2.0 OR MIT"
authors = ["Scott Bowman <scott@bowmans.org>"]
repository = "https://github.com/AndyCappDev/stet"
homepage = "https://github.com/AndyCappDev/stet"

[workspace.dependencies]
thiserror = "2"
png = "0.17"
rayon = "1"
stet-tiny-skia = { path = "crates/stet-tiny-skia", version = "0.11.4" }
eframe = "0.31"
egui = "0.31"
stet-fonts = { path = "crates/stet-fonts", version = "0.6.0" }
stet-graphics = { path = "crates/stet-graphics", version = "0.6.0" }
stet-core = { path = "crates/stet-core", version = "0.6.0" }
stet-ops = { path = "crates/stet-ops", version = "0.6.0" }
stet-engine = { path = "crates/stet-engine", version = "0.6.0" }
# `default-features = false` so a member can decline `ps-device` (and with
# it stet-core). Members that need it name it; see
# scripts/check-crate-independence.sh.
stet-render = { path = "crates/stet-render", version = "0.6.0", default-features = false }
stet-pdf = { path = "crates/stet-pdf", version = "0.6.0" }
stet-viewer = { path = "crates/stet-viewer", version = "0.6.0" }
stet-pdf-reader = { path = "crates/stet-pdf-reader", version = "0.6.0" }
stet = { path = "crates/stet", version = "0.6.0" }

# Release codegen with arithmetic overflow checking left on.
#
# The default `release` profile has `overflow-checks = false`, so an integer
# overflow wraps silently: the August 2026 hardening sweep found several places
# where a file-supplied value overflowed a size computation and produced an
# undersized buffer rather than an error, and every one of them was invisible
# in release testing while panicking loudly in debug. This profile exists so
# that class can be found at release speed — fast enough to sweep the whole PDF
# corpus, strict enough to trap the wrap.
#
# It is a testing and CI profile, not a shipping one. Published binaries use
# `release`; a trapped overflow is a panic, which is not what a renderer should
# do to a user over a malformed file. Build it with `cargo build --profile hardened`.
[profile.hardened]
inherits = "release"
overflow-checks = true
debug-assertions = true

# The vendored tiny-skia forks emulate SIMD lanes with scalar arrays. That
# arithmetic is modular *by definition* — the aarch64 paths call `vsubq_u16` /
# `vmulq_u16`, and hardware SIMD has no overflow trap — so the scalar fallback
# must wrap to agree with them. Trapping it would make the two paths disagree
# and reports a false positive on every gradient the renderer draws. Excluded
# from the hardened profile's checks rather than rewritten, so the forks stay
# close to upstream.
[profile.hardened.package.stet-tiny-skia]
overflow-checks = false

[profile.hardened.package.stet-tiny-skia-path]
overflow-checks = false
