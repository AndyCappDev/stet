[workspace]
members = ["crates/*"]
exclude = ["crates/stet-wasm"]
resolver = "2"

[workspace.package]
version = "0.4.0"
edition = "2024"
# Verified by compiling, not inferred: the `msrv` CI job builds the workspace
# on exactly this toolchain. 1.88 is what let-chains need, and first-party
# code uses them in 282 places. Raising this is allowed in any minor release
# — see the MSRV note in README.md — but it must be a deliberate edit with a
# CHANGELOG line, never a silent consequence of a `cargo update`.
rust-version = "1.88"
license = "Apache-2.0 OR MIT"
authors = ["Scott Bowman <scott@bowmans.org>"]
repository = "https://github.com/AndyCappDev/stet"
homepage = "https://github.com/AndyCappDev/stet"

[workspace.dependencies]
thiserror = "2"
png = "0.17"
rayon = "1"
stet-tiny-skia = { path = "crates/stet-tiny-skia", version = "0.11.4" }
eframe = "0.31"
egui = "0.31"
stet-fonts = { path = "crates/stet-fonts", version = "0.4.0" }
stet-graphics = { path = "crates/stet-graphics", version = "0.4.0" }
stet-core = { path = "crates/stet-core", version = "0.4.0" }
stet-ops = { path = "crates/stet-ops", version = "0.4.0" }
stet-engine = { path = "crates/stet-engine", version = "0.4.0" }
stet-render = { path = "crates/stet-render", version = "0.4.0" }
stet-pdf = { path = "crates/stet-pdf", version = "0.4.0" }
stet-viewer = { path = "crates/stet-viewer", version = "0.4.0" }
stet-pdf-reader = { path = "crates/stet-pdf-reader", version = "0.4.0" }
stet = { path = "crates/stet", version = "0.4.0" }
