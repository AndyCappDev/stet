name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Fast lint + format check — only needs one OS.
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        # Clippy runs but only errors gate; warnings do not fail the build.
        # The workspace carries a backlog of style warnings — collapsible_if
        # dominates, mostly because clippy now suggests Rust 2024 let-chains
        # for code written before they stabilised. None are correctness lints.
        #
        # The vendored tiny-skia forks allow the style and complexity groups
        # in their own Cargo.toml [lints] tables, so what remains here is
        # first-party code. Fix them opportunistically when touching the
        # surrounding code; there is no deadline and no tracking file.
        run: cargo clippy --workspace --all-targets
      - name: VM level-zero allocation audit
        # Operator code must allocate through stet_ops::vm_ops::alloc_*, which
        # stamps the current save level and VM mode. The bare
        # `allocate_at_level_zero` variants hardcode both, producing objects
        # that `restore` releases but `invalidrestore` cannot see. Only
        # interpreter bootstrap may use them. See scripts/check-level-zero-alloc.sh.
        run: scripts/check-level-zero-alloc.sh
      - name: crate independence audit
        # The narrow-waist architecture only pays off if each half can be
        # taken without the other: a PDF-only consumer must not link the
        # PostScript VM, and a PostScript-only consumer must not link the PDF
        # parser. The facade carries stet-pdf-reader as a dev-dependency for
        # exactly that reason, and one line in the wrong table would silently
        # add the whole PDF parser to a consumer's build.
        # See scripts/check-crate-independence.sh.
        run: scripts/check-crate-independence.sh
      - name: tag namespace audit
        # The v* namespace is reserved for releases: every v* tag must be
        # exactly vX.Y.Z and have a CHANGELOG entry. Benchmarks and
        # experiments use perf/ or exp/ prefixes. Written after
        # v0.6.1-perf and v0.6.2-perf spent months looking like shipped
        # releases. See scripts/check-tags.sh.
        run: scripts/check-tags.sh
      - name: CLI documentation cross-check
        # Every option the CLI parses must appear in --help and in both
        # READMEs. crates.io renders crates/stet-cli/README.md, so a flag
        # documented only in --help cannot be found by anyone deciding
        # whether to install stet. `--page`, `--password`, `--max-vm`, and
        # `--timeout` all shipped that way. See scripts/check-cli-docs.sh.
        run: scripts/check-cli-docs.sh
      - name: release-version cross-check
        # Verifies the workspace `Cargo.toml` version matches the README
        # badge + Producer string and that CHANGELOG.md has an entry.
        # Catches "bumped Cargo.toml, forgot README/CHANGELOG" before a
        # tag goes out. See scripts/check-release-versions.sh.
        run: scripts/check-release-versions.sh

  # Cross-platform build + test. Proves the code compiles on each OS and
  # catches portability regressions early. All three OSes are green,
  # Windows included — nothing here is allowed to fail, so treat a red
  # tick as a real regression.
  build-test:
    name: ${{ matrix.os }} / ${{ matrix.rust }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
      - name: cargo build --release --workspace
        run: cargo build --release --workspace
      - name: cargo test --workspace
        # Tests cover the library surface on every OS. This runs the *debug*
        # profile, so `debug_assertions` is on: `Context::vm_restore`'s
        # no-dangling-reference audit sweep executes after every `restore`
        # here, on all three OSes. That is the only place it runs in CI —
        # the release build compiles it out.
        run: cargo test --workspace

      # PostScript-level test suite. Runs the entire unit_tests/*.ps corpus
      # via the meta-runner ps_tests.ps, which writes per-file totals to
      # `unit_tests/.test_stats.tmp`, prints "Total Errors: N" at the end,
      # and calls `1 .quitwithcode` if any test failed. The `.quitwithcode`
      # operator (added alongside this step) propagates the exit code to
      # the shell so a non-zero exit fails the CI run. Linux only — the
      # test outcomes are OS-independent and `unit_tests/` writes a temp
      # file with a fixed relative path that the matrix's other OSes don't
      # need to redo. Mirrors how PostForge runs its own ps_tests.ps in CI.
      - name: PostScript unit tests (unit_tests/ps_tests.ps)
        if: matrix.os == 'ubuntu-latest'
        run: ./target/release/stet unit_tests/ps_tests.ps

  # MSRV — the README badge and `[workspace.package] rust-version` both claim
  # 1.88, and this is what makes that a tested fact rather than a guess. Pin
  # the toolchain rather than tracking `rust-version`: the point is to fail on
  # the commit that raises the real floor, which a floating toolchain cannot do.
  #
  # It has to *compile*, not just read manifests. Reading declared metadata
  # would put the floor at 1.87 — hayro-jpeg2000 0.3.4 declares less than it
  # needs and then fails on let-chains, which only a real build catches.
  #
  # `check`, not `build --release` or `test`: this answers "does it compile on
  # the oldest supported toolchain", and build-test already covers behaviour on
  # three OSes. When a dependency raises its own MSRV and breaks this job, the
  # fix is either pinning that dependency back or raising ours deliberately —
  # bump Cargo.toml, the README badge, and add a CHANGELOG line together.
  msrv:
    name: MSRV 1.88
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - name: cargo check --workspace --all-targets
        run: cargo check --workspace --all-targets

  # Arithmetic overflow gate.
  #
  # The default release profile wraps on overflow, so a size computation that
  # overflows a file-supplied value produces an undersized buffer instead of an
  # error, and stays invisible in release testing. The `hardened` profile is
  # release codegen with overflow checks left on; running the suite under it
  # turns that class into a test failure.
  #
  # This is a gate on the test suite only. The higher-yield use of the profile
  # is sweeping the local PDF corpus, which is not in CI — see SECURITY.md.
  hardened:
    name: Overflow checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: hardened
      - name: cargo test --workspace --profile hardened
        run: cargo test --workspace --profile hardened

  # WASM build — smoke test that the browser-facing crate still compiles.
  # stet-wasm is excluded from the default workspace, so it needs its own
  # step. No tests here — wasm-pack test would need a browser runtime.
  wasm:
    name: wasm32 build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm
      - name: cargo check --target wasm32-unknown-unknown
        working-directory: crates/stet-wasm
        run: cargo check --target wasm32-unknown-unknown --release
