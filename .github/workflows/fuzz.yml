name: Fuzz

# Weekly, not per-push.
#
# This ran on every push until 2026-08-27, where it was the longest job in the
# run — mostly `cargo install cargo-fuzz`, a from-source build — while being
# the one job that could not fail the build. It gated nothing and sat on the
# critical path of every commit.
#
# The value it does have is bit-rot detection: proving the harnesses still
# compile against a moving nightly and a moving cargo-fuzz. That is worth
# checking weekly, not hourly.
#
# Moving it off the push path also buys a real budget. 60s per target from a
# cold corpus finds nothing — SECURITY.md records that the first genuine
# campaign's findings were all false positives bar one known upstream
# overflow.
#
# One job per target, in a matrix. Each target then gets its own runner and
# its own four cores instead of taking turns on one, so the wall clock is a
# single target's budget rather than five in sequence. That is what pays for
# the default: 1500s per target, five times the search the sequential version
# did, in the same ~25 minutes. Actions minutes are free on a public repo, so
# the five runners cost nothing.
#
# `fail-fast: false` because a crash in one target must not cancel the other
# four — the point of the run is to collect every finding, not the first.
#
# This is a search, not a gate, and it cannot be made into one: fuzzing has no
# completion criterion, and a run that passes says nothing about the next one.
# The release gate is `./fuzz/replay.sh` (deterministic, ~4 minutes) plus the
# regression tests every past finding was promoted into. See CLAUDE.md.
on:
  schedule:
    # Mondays, 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      duration:
        description: "Seconds per target"
        required: false
        default: "1500"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Derive the target list from the fuzz crate's own [[bin]] sections rather
  # than repeating it here. A sixth target added to `fuzz/Cargo.toml` is then
  # fuzzed by CI without anyone remembering to edit this file — the failure
  # mode of a hardcoded matrix is silent, and a target nobody runs is worse
  # than a target that does not exist.
  targets:
    name: Enumerate targets
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.find.outputs.list }}
    steps:
      - uses: actions/checkout@v5
      - id: find
        run: |
          list=$(sed -n 's/^name = "\(fuzz_[a-z0-9_]*\)"$/\1/p' fuzz/Cargo.toml \
                 | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "found: $list"
          if [ "$list" = "[]" ]; then
            echo "::error::no fuzz targets found in fuzz/Cargo.toml"
            exit 1
          fi
          echo "list=$list" >> "$GITHUB_OUTPUT"

  fuzz:
    name: Fuzz ${{ matrix.target }}
    needs: targets
    runs-on: ubuntu-latest
    # A cancelled job is not a failed one, so the `if: failure()` artifact
    # upload below never fires on a timeout — the reproducers would be lost
    # exactly when they matter. Cap the job below GitHub's 6h ceiling so an
    # over-long dispatch fails cleanly and still uploads.
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.list) }}
    # No `continue-on-error` here, unlike when this lived in ci.yml. That
    # existed so a nightly or cargo-fuzz breakage could not block a PR about
    # something else. On a schedule there is no PR to block, so a genuine
    # crash should show up red rather than be swallowed.
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          key: fuzz
          workspaces: fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Seed corpora
        # libFuzzer replays the entire seed corpus before `-max_total_time`
        # means anything, so this stays capped even with a larger budget —
        # 703 PDFs under AddressSanitizer would spend the whole run replaying.
        run: SEED_LIMIT=200 ./fuzz/seed-corpus.sh
      - name: Run target
        run: ./fuzz/run.sh "${{ github.event.inputs.duration || '1500' }}" "${{ matrix.target }}"
      # upload-artifact@v4 requires a unique name per job, so key it by target.
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore
