[package]
name = "stet-graphics"
version = "0.10.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Display-list IR, ICC colour management, and graphics types — a stable target for custom PostScript and PDF renderers"
repository.workspace = true
homepage.workspace = true
keywords = ["graphics", "display-list", "icc", "color", "cmyk"]
categories = ["graphics", "rendering"]

[dependencies]
stet-fonts.workspace = true
moxcms = { version = "0.8", features = ["any_to_any"] }
# JPEG decoding (`jpeg`). Default features off: `rayon` comes in through the
# `parallel` feature, so a build that wants no threads gets none.
jpeg-decoder = { version = "0.3", default-features = false }
zune-jpeg = "0.5"
zune-core = "0.5"
hayro-ccitt = "0.4.0"
fax = "0.2.6"
sha2 = "0.10"
glob = "0.3"

[features]
# Decode a JPEG's components on several threads (`jpeg-decoder`'s `rayon`).
parallel = ["jpeg-decoder/rayon"]
