[package]
name = "stet-wasm"
version = "0.2.0"
edition = "2024"
# Spelled out rather than inherited: this crate is `exclude`d from the root
# workspace, so `rust-version.workspace = true` has nothing to resolve
# against. It depends on the stet crates by path, so its floor is theirs.
# check-release-versions.sh asserts this literal matches [workspace.package]
# rust-version, so the two cannot drift.
rust-version = "1.88"
license = "Apache-2.0 OR MIT"
authors = ["Scott Bowman <scott@bowmans.org>"]
description = "WebAssembly bindings for stet PostScript interpreter"
repository = "https://github.com/AndyCappDev/stet"
homepage = "https://github.com/AndyCappDev/stet"
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
stet-fonts = { path = "../stet-fonts" }
stet-graphics = { path = "../stet-graphics" }
stet-core = { path = "../stet-core" }
stet-ops = { path = "../stet-ops" }
stet-engine = { path = "../stet-engine" }
stet-render = { path = "../stet-render", default-features = false }
stet-pdf-reader = { path = "../stet-pdf-reader", default-features = false, features = ["jpx"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = ["console"]

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
