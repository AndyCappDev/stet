# Hand-maintained. This started as the registry-normalised Cargo.toml of
# tiny-skia 0.11.4 and still carries that layout (one [dependencies.x] table
# per dep), but it is edited directly now — the package was renamed, the
# tiny-skia-path dep was repointed at the sibling fork, repository/homepage
# point at the fork, and there is no Cargo.toml.orig to regenerate from.
# Do not treat it as generated output.
#
# Version 0.11.4 tracks upstream and is independent of the workspace version;
# see the release notes in CLAUDE.md.

[package]
edition = "2018"
name = "stet-tiny-skia"
version = "0.11.4"
authors = ["Yevhenii Reizner <razrfalcon@gmail.com>"]
description = "A tiny Skia subset ported to Rust."
documentation = "https://docs.rs/tiny-skia/"
readme = "README.md"
keywords = [
    "2d",
    "rendering",
    "skia",
]
categories = ["rendering"]
license = "BSD-3-Clause"
repository = "https://github.com/AndyCappDev/stet"
homepage = "https://github.com/AndyCappDev/stet"

# Vendored upstream code. Style and complexity lints are allowed so the fork
# stays diffable against upstream tiny-skia — restyling it to satisfy clippy
# would bury the analytical-AA changes in cosmetic noise. `src/lib.rs` already
# carries upstream's own per-lint allows, but a crate-root attribute does not
# reach the `tests/` and `examples/` targets, which is where most of the noise
# was. A [lints] table applies to every target in the package.
#
# correctness, suspicious, and perf stay on: this crate is actively modified,
# and those are the groups that catch a real defect in a change of ours.
[lints.clippy]
style = { level = "allow", priority = -1 }
complexity = { level = "allow", priority = -1 }

[dependencies.arrayref]
version = "0.3.6"

[dependencies.arrayvec]
version = "0.7"
default-features = false

[dependencies.bytemuck]
version = "1.12"
features = ["aarch64_simd"]

[dependencies.cfg-if]
version = "1"

[dependencies.log]
version = "0.4"

[dependencies.png]
version = "0.17"
optional = true

[dependencies.tiny-skia-path]
path = "../stet-tiny-skia-path"
package = "stet-tiny-skia-path"
version = "0.11.4"
default-features = false

[features]
default = [
    "std",
    "simd",
    "png-format",
]
no-std-float = ["tiny-skia-path/no-std-float"]
png-format = [
    "std",
    "png",
]
simd = []
std = ["tiny-skia-path/std"]
