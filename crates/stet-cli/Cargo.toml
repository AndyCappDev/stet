[package]
name = "stet-cli"
version = "0.8.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Render PostScript, EPS, and PDF to PNG or PDF from the command line — pure Rust, no Ghostscript required"
repository.workspace = true
homepage.workspace = true
# A binary has no library API for docs.rs to document — its build fails
# with "no library targets found" — so point crates.io's Documentation
# link at the command-line usage instead.
documentation = "https://github.com/AndyCappDev/stet#cli-usage"
keywords = ["postscript", "pdf", "cli", "eps", "rendering"]
categories = ["command-line-utilities", "graphics"]

[[bin]]
name = "stet"
path = "src/main.rs"
# Shares its name with the `stet` library, so documenting both would write
# the same `target/doc/stet/` directory; the CLI has no library docs anyway.
doc = false

[dependencies]
stet.workspace = true
stet-fonts.workspace = true
stet-graphics.workspace = true
stet-core.workspace = true
stet-engine.workspace = true
stet-ops.workspace = true
stet-render = { workspace = true, features = ["parallel", "ps-device"] }
stet-pdf.workspace = true
stet-pdf-reader.workspace = true
rayon.workspace = true
png.workspace = true
stet-viewer = { workspace = true, optional = true }

[features]
default = ["viewer"]
viewer = ["dep:stet-viewer"]
