# Hand-maintained. This started as the registry-normalised Cargo.toml of
# tiny-skia-path 0.11.4 and still carries that layout (one [dependencies.x]
# table per dep), but it is edited directly now — the package was renamed,
# repository/homepage point at the fork, and there is no Cargo.toml.orig to
# regenerate from. Do not treat it as generated output.
#
# Version 0.11.4 tracks upstream and is independent of the workspace version;
# see the release notes in CLAUDE.md.

[package]
edition = "2018"
name = "stet-tiny-skia-path"
version = "0.11.4"
authors = ["Yevhenii Reizner <razrfalcon@gmail.com>"]
description = "A tiny-skia Bezier path implementation"
documentation = "https://docs.rs/tiny-skia-path/"
readme = "README.md"
keywords = [
    "graphics",
    "bezier",
    "path",
    "dash",
    "stroke",
]
categories = ["graphics"]
license = "BSD-3-Clause"
repository = "https://github.com/AndyCappDev/stet"
homepage = "https://github.com/AndyCappDev/stet"

# Vendored upstream code — see the matching note in stet-tiny-skia/Cargo.toml.
# Style and complexity are allowed so the fork stays diffable against upstream;
# correctness, suspicious, and perf stay on to catch defects in our own edits.
[lints.clippy]
style = { level = "allow", priority = -1 }
complexity = { level = "allow", priority = -1 }

[dependencies.arrayref]
version = "0.3.6"

[dependencies.bytemuck]
version = "1.4"

[dependencies.libm]
version = "0.2.1"
optional = true

[dependencies.strict-num]
version = "0.1"
default-features = false

[features]
default = ["std"]
no-std-float = ["libm"]
std = []
