[package]
name = "stet-pdf-reader"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0 OR MIT"
authors.workspace = true
description = "Pure-Rust PDF parser and renderer — no C dependencies, prepress-grade CMYK and spot colour, plus a read-only structural API"
repository.workspace = true
homepage.workspace = true
keywords = ["pdf", "parser", "rendering", "cmyk", "prepress"]
categories = ["parser-implementations", "graphics"]

[dependencies]
thiserror.workspace = true
flate2 = "1"
md5 = "0.7"
jpeg-decoder = "0.3"
zune-jpeg = "0.5"
zune-core = "0.5"
stet-fonts.workspace = true
stet-graphics.workspace = true
# `default-features = false` is load-bearing: it drops `ps-device`, and
# with it `stet-core`, so a PDF-only consumer never links the PostScript
# VM. See scripts/check-crate-independence.sh.
stet-render = { workspace = true, optional = true, default-features = false, features = [
    "parallel",
] }
hayro-jpeg2000 = { version = "0.4.1", optional = true }
hayro-ccitt = "0.4.0"
fax = "0.2.6"
hayro-jbig2 = "0.3.1"
skrifa = "0.40"
sha2 = "0.10"
stringprep = { version = "0.1.5", optional = true }

[features]
default = ["jpx", "render", "saslprep"]
render = ["dep:stet-render"]
jpx = ["dep:hayro-jpeg2000"]
# SASLprep (RFC 4013) for AES-256 passwords, as ISO 32000-2 requires. It
# brings in Unicode normalisation tables; without it a password is used as
# the bytes given, which is right for any password that is plain ASCII.
saslprep = ["dep:stringprep"]

[dev-dependencies]
png.workspace = true
