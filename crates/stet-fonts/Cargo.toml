[package]
name = "stet-fonts"
version = "0.8.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Pure-Rust Type 1, CFF / Type 2, and TrueType font parsers plus geometry types — no FreeType, usable standalone"
repository.workspace = true
homepage.workspace = true
keywords = ["font", "type1", "cff", "truetype", "postscript"]
categories = ["graphics", "parser-implementations"]

[dependencies]
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glob = "0.3"
